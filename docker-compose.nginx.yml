services:
  server:
    build:
      args:
        # 与 nginx 反代前缀保持一致；如直接挂在域名根下，使用默认 docker-compose.yml。
        VITE_BASE: "/doc/"

  nginx:
    image: nginx:1.27-alpine
    container_name: web-doc-nginx
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
