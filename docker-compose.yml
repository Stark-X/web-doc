services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 如需挂到反代子路径，可改成 "/doc/" 并同步反代配置。
        VITE_BASE: "/"
        GOPROXY: "${GOPROXY:-https://proxy.golang.org,direct}"
        NPM_CONFIG_REGISTRY: "${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org/}"
    container_name: web-doc-server
    restart: unless-stopped
    environment:
      WEBDOC_ADDR: ":8787"
      WEBDOC_DB_DRIVER: "sqlite"
      WEBDOC_DB_PATH: "/data/webdoc.db"
      WEBDOC_STORAGE: "/data/docs"
      WEBDOC_WEB_ROOT: "/app/web"
      WEBDOC_ORIGIN: "*"
      # WEBDOC_SHARE_BASE_URL: "https://share.example.com/p"
      # WEBDOC_DISABLE_REGISTER: 1 #  to lock down the instance to existing users
    volumes:
      - data:/data
    ports:
      - "8787:8787"

volumes:
  data:
