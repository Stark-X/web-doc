services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 默认单容器直接挂在域名根下；如配合 nginx 反代到 /doc/，请使用 docker-compose.nginx.yml。
        VITE_BASE: "/"
    container_name: web-doc-server
    restart: unless-stopped
    environment:
      WEBDOC_ADDR: ":8787"
      WEBDOC_STORAGE: "/data/docs"
      WEBDOC_WEB_ROOT: "/app/web"
      WEBDOC_ORIGIN: "*"
      WEBDOC_DB_DRIVER: "sqlite"
      WEBDOC_SQLITE_PATH: "/data/webdoc.db"
    volumes:
      - data:/data
    ports:
      - "8787:8787"

volumes:
  data:
